<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Girlfriend?</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
    }

    .emoji {
        font-size: 90px;
    }

    h1 {
        margin-top: 10px;
        font-size: 28px;
    }

    .buttons {
        margin-top: 30px;
        position: relative;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background: #ff4d6d;
        color: white;
    }

    #noBtn {
        background: #ccc;
        color: black;
        margin-left: 15px;
        position: relative;
    }

    .success {
        font-size: 32px;
        color: #ff4d6d;
        font-weight: bold;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="container" id="mainBox">
    <div class="emoji">👶💖</div>
    <h1>Will you be my girlfriend?</h1>

    <div class="buttons">
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>
</div>

<script>
let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let mainBox = document.getElementById("mainBox");

let yesSize = 20;

yesBtn.onclick = () => {
    mainBox.innerHTML = `
        <div class="emoji">💍💖</div>
        <div class="success">
            Congratulations 🎉<br>
            You are now my girlfriend 😍
        </div>
    `;
};

noBtn.onclick = () => {
    // Increase YES button size
    yesSize += 15;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (yesSize/2) + "px " + yesSize + "px";

    // Move NO button randomly
    let x = Math.random() * 300 - 150;
    let y = Math.random() * 200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    // Shrink NO button
    let current = parseInt(window.getComputedStyle(noBtn).fontSize);
    if (current > 8) {
        noBtn.style.fontSize = (current - 2) + "px";
    }

    // If YES becomes huge → auto accept
    if (yesSize > 120) {
        yesBtn.click();
    }
};
</script>

</body>
</html>
